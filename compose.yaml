# Run from the repository root: docker compose up --build -d
name: northstar-demo
services:
  gateway:
    build:
      context: .
      dockerfile: docs/deployment/Dockerfile
    extra_hosts:
      - "${MODEL_HOST_ALIAS}:${MODEL_HOST_GATEWAY}"
    env_file:
      - .env
    environment:
      SESSION_DIR: /data/sessions
      BACKEND_API_BASE_URL: http://backend-api:8001
    depends_on:
      backend-api:
        condition: service_healthy
    command:
      - python
      - -m
      - uvicorn
      - backend.gateway.main:app
      - --host
      - "${APP_BIND_HOST}"
      - --port
      - "${APP_PORT}"
      - --workers
      - "1"
      - --timeout-graceful-shutdown
      - "40"
    ports:
      - "${APP_PUBLISH_HOST}:${APP_PUBLISH_PORT}:${APP_PORT}"
    volumes:
      - sessions:/data
    init: true
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(os.environ['APP_HEALTH_URL'], timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
  backend-api:
    build:
      context: .
      dockerfile: docs/deployment/Dockerfile
    command:
      - python
      - -m
      - uvicorn
      - backend.api.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8001"
      - --workers
      - "1"
    environment:
      BACKEND_DATA_PATH: /data/backend/bookings.json
    volumes:
      - backend-data:/data/backend
    # Internal network only: no `ports:` entry, so the browser cannot reach it.
    expose:
      - "8001"
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
volumes:
  sessions:
  backend-data:
