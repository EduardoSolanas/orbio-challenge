# Run from the repository root: docker compose up --build -d
# Three containers: `web` (nginx: serves the page, forwards the API), `gateway`
# (the chat service) and `backend-api` (private account and booking service).
name: northstar-demo
services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${APP_PUBLISH_HOST}:${APP_PUBLISH_PORT}:8080"
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    extra_hosts:
      - "${MODEL_HOST_ALIAS}:${MODEL_HOST_GATEWAY}"
    env_file:
      - .env
    environment:
      SESSION_DIR: /data/sessions
      BACKEND_API_BASE_URL: http://backend-api:8001
    depends_on:
      backend-api:
        condition: service_healthy
    # Internal network only: the browser reaches it through `web`.
    expose:
      - "8000"
    volumes:
      - sessions:/data
    init: true
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
  backend-api:
    build:
      context: .
      dockerfile: backend_api/Dockerfile
    environment:
      BACKEND_DATA_PATH: /data/backend/bookings.json
    volumes:
      - backend-data:/data/backend
    # Internal network only: no `ports:` entry, so the browser cannot reach it.
    expose:
      - "8001"
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
volumes:
  sessions:
  backend-data:
