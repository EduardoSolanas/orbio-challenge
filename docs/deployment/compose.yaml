# Proposed runtime contract: requires the application and requirements.txt to be implemented.
name: northstar-demo
services:
  app:
    build:
      context: ../..
      dockerfile: docs/deployment/Dockerfile
    env_file:
      - .env
    environment:
      SESSION_DIR: /data/sessions
      PROVIDER_MAX_CONCURRENCY: "4"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - sessions:/data
    init: true
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
volumes:
  sessions:
