[project]
name = "northstar-support-intake"
version = "0.1.0"
description = "Fictional Northstar Shop support intake application (FastAPI)."
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# scripts add the repo root to sys.path before importing from it
"scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"
markers = [
    "browser_e2e: controlled-provider browser workflow journeys J01-J10; never live Docker/provider proof",
    "live: paid provider smoke, requires explicit opt-in",
    "intent_judge: E2E intent routing evaluated by the configured local LLM judge",
    "docker_e2e: real deployed Docker UI and HTTP routes; never a provider fake",
]

[tool.coverage.run]
branch = true
source = ["gateway", "backend_api", "shared"]
omit = ["gateway/main.py", "gateway/routes/endpoints.py", "gateway/routes/http_support.py", "gateway/routes/asgi_guards.py", "gateway/schemas.py", "gateway/providers/prompts.py", "gateway/errors.py"]

[tool.coverage.json]
show_contexts = true

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mutmut]
source_paths = ["gateway/", "backend_api/", "shared/"]
do_not_mutate = ["gateway/__init__.py", "gateway/routes/__init__.py", "gateway/conversation/__init__.py", "gateway/providers/__init__.py", "gateway/knowledge/__init__.py", "backend_api/__init__.py", "shared/__init__.py", "gateway/main.py", "gateway/routes/endpoints.py", "gateway/routes/http_support.py", "gateway/routes/asgi_guards.py", "gateway/schemas.py", "gateway/providers/prompts.py", "gateway/errors.py"]
pytest_add_cli_args_test_selection = ["tests/unit", "tests/integration"]
also_copy = ["web/", "tests/", "scripts/", "examples/", "docs/", "README.md", "pyproject.toml", "compose.yaml"]
mutate_only_covered_lines = false
# Mutations no test can observe, so they are not worth a survivor each: SQL keyword case, the codec
# name when reading the project's own JSON files, HTTP verb case, deep versus shallow copy (the
# copy's lists are replaced straight away), and the one default for a missing setting.
do_not_mutate_patterns = [
    '"(SELECT|UPDATE|INSERT OR IGNORE|DELETE FROM|CREATE (UNIQUE )?(TABLE|INDEX)) ',
    '^\s*"\s?(WHERE|ORDER BY|FROM|AND|ON) ',
    'read_text\((encoding=)?"utf-8"\)',
    '^\s*"(GET|POST)",$',
    'model_copy\(deep=True\)',
    'return env\.get\(key, ""\)',
]
