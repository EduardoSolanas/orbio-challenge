[project]
name = "northstar-support-intake"
version = "0.1.0"
description = "Fictional Northstar Shop support intake application (FastAPI)."
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"
markers = [
    "browser_e2e: controlled-provider browser workflow journeys J01-J10; never live Docker/provider proof",
    "live: paid provider smoke, requires explicit opt-in",
    "intent_judge: E2E intent routing evaluated by the configured local LLM judge",
    "docker_e2e: real deployed Docker UI and HTTP routes; never a provider fake",
]

[tool.coverage.run]
branch = true
source = ["backend"]
omit = ["backend/gateway/main.py", "backend/gateway/routes/endpoints.py", "backend/gateway/routes/http_support.py", "backend/gateway/routes/asgi_guards.py", "backend/gateway/schemas.py", "backend/gateway/providers/prompts.py", "backend/gateway/errors.py"]

[tool.coverage.json]
show_contexts = true

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mutmut]
source_paths = ["backend/"]
do_not_mutate = ["backend/gateway/__init__.py", "backend/gateway/routes/__init__.py", "backend/gateway/conversation/__init__.py", "backend/gateway/providers/__init__.py", "backend/gateway/knowledge/__init__.py", "backend/__init__.py", "backend/gateway/main.py", "backend/gateway/routes/endpoints.py", "backend/gateway/routes/http_support.py", "backend/gateway/routes/asgi_guards.py", "backend/gateway/schemas.py", "backend/gateway/providers/prompts.py", "backend/gateway/errors.py"]
pytest_add_cli_args_test_selection = ["tests/unit", "tests/integration"]
also_copy = ["web/", "tests/", "scripts/", "examples/", "docs/", "README.md", "pyproject.toml", "compose.yaml"]
mutate_only_covered_lines = false
