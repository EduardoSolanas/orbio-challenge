<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f7ee">
  <meta name="description" content="Northstar Energy customer support chat.">
  <title data-i18n="title"></title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/objects.css">
  <link rel="stylesheet" href="/static/css/skins.css">
</head>
<body>
<main class="shell">
  <section class="panel skin-paper" id="support-chat" role="dialog" aria-modal="false" aria-label="Northstar Energy support chat" data-i18n-aria-label="site.chat_dialog">
    <header class="bar bar--header skin-forest">
      <span class="badge skin-glass" aria-hidden="true"><svg class="icon icon--m" viewBox="0 0 24 24"><path d="M13.1 1.8 4.8 13h5.8l-.7 9.2L19.2 10h-6.1z"/></svg></span>
      <div class="bar__body"><strong class="title">Northstar Energy</strong><small class="subtitle text-on-dark-soft" data-i18n="site.chat_status"></small></div>
      <button type="button" id="new-intake" class="btn btn--square bar__push skin-glass-button" aria-label="New conversation" data-i18n-aria-label="actions.new_intake" title="New conversation">↻</button>
    </header>
    <div id="transcript" class="panel__scroll skin-log" role="log" aria-live="polite" aria-relevant="additions" aria-label="Conversation" data-i18n-aria-label="site.chat_log"></div>
    <section id="review" class="notice notice--pre skin-review" role="region" aria-label="Review details" data-i18n-aria-label="ui.review_region" hidden></section>
    <section id="slot-picker" class="cluster cluster--loose cluster--margin" role="region" aria-label="Available technician times" data-i18n-aria-label="ui.slots_region" hidden></section>
    <div id="alert" class="notice skin-alert" role="alert" hidden></div>
    <section id="order-verification" class="notice stack skin-form" role="region" aria-label="Account verification" data-i18n-aria-label="auth.verification_region" aria-describedby="verification-notice" hidden>
      <p id="verification-notice" class="callout skin-note" data-i18n="auth.demo_code_notice"></p>
      <label class="form-label" for="delivery-postcode" data-i18n="auth.postcode_label"></label>
      <input id="delivery-postcode" class="field skin-field" name="delivery_postcode" type="text" autocomplete="postal-code" data-i18n-aria-label="auth.postcode_label">
      <label class="form-label" for="verification-code" data-i18n="auth.code_label"></label>
      <input id="verification-code" class="field skin-field" name="verification_code" type="text" inputmode="numeric" autocomplete="one-time-code" data-i18n-aria-label="auth.code_label">
      <p id="verification-error" class="text-flush text-error" role="alert" hidden></p>
      <button type="button" id="verify-order" class="btn btn--pill skin-outline" data-i18n="auth.verify_action"></button>
    </section>
    <p id="verification-status" class="note text-brand" role="status" hidden></p>
    <form class="bar bar--compose skin-paper" id="message-form">
      <label for="message" class="u-sr-only" data-i18n="ui.message_label"></label>
      <button type="button" id="wav-attach" class="btn btn--round skin-bare" aria-label="Attach WAV audio" data-i18n-aria-label="actions.choose_wav">
        <svg class="icon icon--m" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 6.5 8.2 14.8a2.25 2.25 0 0 0 3.2 3.2l8.1-8.1a4 4 0 0 0-5.7-5.7L5.4 12.6a5.75 5.75 0 0 0 8.1 8.1l7-7-1.4-1.4-7 7a3.75 3.75 0 0 1-5.3-5.3l8.4-8.4a2 2 0 0 1 2.8 2.8l-8.1 8.1a.25.25 0 0 1-.4-.3l8.3-8.3z"/></svg>
      </button>
      <input id="wav-recording" class="u-sr-only" type="file" accept="audio/wav,.wav,audio/wave" tabindex="-1" aria-hidden="true">
      <button type="button" id="start-recording" class="btn btn--round skin-mint" aria-label="Start recording" data-i18n-aria-label="actions.start_recording"><span class="u-sr-only" data-i18n="actions.start_recording"></span><svg class="icon icon--m" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a1 1 0 1 1 2 0 7 7 0 0 1-6 6.93V21h3a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2h3v-3.07A7 7 0 0 1 5 11a1 1 0 1 1 2 0 5 5 0 0 0 10 0Z"/></svg></button>
      <button type="button" id="stop-recording" class="btn btn--round skin-danger-soft" aria-label="Stop recording" data-i18n-aria-label="actions.stop_recording" hidden><span class="u-sr-only" data-i18n="actions.stop_recording"></span><svg class="icon icon--m" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7z"/></svg></button>
      <textarea id="message" class="field field--pill skin-field" name="message" rows="1" maxlength="4000" autocomplete="off" placeholder="Ask us about your energy…" data-i18n-placeholder="site.chat_placeholder" data-i18n-aria-label="ui.message_label"></textarea>
      <button type="button" id="send" class="btn btn--round skin-solid" aria-label="Send" data-i18n-aria-label="actions.send"><span class="u-sr-only" data-i18n="actions.send"></span><svg class="icon icon--m" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
    </form>
    <p id="transcribe-help" class="hint hint--tight text-warn" role="status" aria-live="polite" hidden></p>
    <div class="cluster cluster--inset"><button type="button" id="retry" class="btn btn--pill skin-outline" data-i18n="actions.retry" hidden></button><button type="button" id="confirm" class="btn btn--pill skin-outline" data-i18n="actions.confirm" hidden></button></div>
    <audio id="reply-audio" data-testid="reply-audio" aria-hidden="true" hidden></audio>
    <p id="playback-disclosure" class="hint text-muted"><span data-i18n="speech.disclosure"></span><span aria-hidden="true"> · </span><span data-i18n="site.chat_privacy"></span></p>
  </section>
</main>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
