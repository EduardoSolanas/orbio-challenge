# The only public entry point: serves the page and forwards the API to the gateway.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # A 10 MB WAV upload plus multipart overhead; the gateway enforces the real limit.
    client_max_body_size 11m;

    # Always revalidate the page and its assets so a redeploy is picked up.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location /static/ {
        alias /usr/share/nginx/html/;
        add_header Cache-Control "no-cache" always;
    }

    location /api/ {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A turn can wait on the model for most of its 25 s deadline.
        proxy_read_timeout 90s;
    }

    location = /health {
        proxy_pass http://gateway:8000;
    }

    # Nothing else is public; the Backend API is not reachable from here at all.
    location / {
        return 404;
    }
}
